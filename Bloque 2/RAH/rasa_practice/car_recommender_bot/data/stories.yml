version: "3.1"

stories:

  - story: help with fuel type
    steps:
      - intent: ask_help
      - action: utter_help_with_what
      - intent: with_fuel_type
      - action: info_fuel_type_form
      - active_loop: info_fuel_type_form
      # finish form
      - action: info_fuel_type_form
      - active_loop: null
      - action: compute_best_fuel_type

  - story: help with max price (yes)
    steps:
      - intent: ask_help
      - action: utter_help_with_what
      - intent: with_max_price
      - action: utter_info_about_prices
      - action: info_income_form
      - active_loop: info_income_form
      # finish form
      - action: info_income_form
      - active_loop: null
      - action: compute_best_max_price

  - story: car specs form
    steps:
      - intent: know_the_specifics
      - action: info_car_form
      - active_loop: info_car_form
      # finish form
      - action: info_car_form
      - active_loop: null
      - action: query

  - story: help with mileage
    steps:
      - intent: ask_help
      - action: utter_help_with_what
      - intent: with_max_mileage
      - action: utter_response_max_mileage

  - story: send by email
    steps:
      - intent: send_by_email
      - action: send_by_email_form
      - active_loop: send_by_email
      - action: send_by_email_form
      - action: send_by_email

  - story: interactive_story_1
    steps:
    - intent: greet
